name: 服务器验证
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  core:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 安装修复后的 pip
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip install -r requirements-frozen.txt -r requirements-dev.txt
      - run: bash scripts/test.sh
        env:
          PYTHON: python
      - run: python run.py --check
      - run: python scripts/export-public.py

  linux-install:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12-slim', 'debian:13-slim']
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: 验证真实系统的安装和只读启动检查
        shell: bash
        run: |
          cp scripts/install-linux.sh /tmp/vrcx-cloud-install.sh
          bash /tmp/vrcx-cloud-install.sh --dir /tmp/vrcx-cloud-first-install --no-start
          cd /tmp/vrcx-cloud-first-install
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/start-linux.sh --check
          bash scripts/install-linux.sh --no-start
