name: 手动验证服务器包
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13.17'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 安装修复后的 pip
        run: python -m pip install "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"
      - run: python -m pip install -r requirements-frozen.txt -r requirements-dev.txt
      - run: bash scripts/test.sh
        env:
          PYTHON: python
      - run: docker compose -f server/compose.yaml config --quiet
      - run: docker compose -f server/compose.yaml build
      - name: 验证容器入口
        run: docker compose -f server/compose.yaml run --rm app --host 127.0.0.1 --check
      - name: 验证非 root 数据卷与容器内 HTTP
        run: |
          docker compose -f server/compose.yaml run --rm app --init
          docker compose -f server/compose.yaml run --rm --entrypoint python app -c "import runpy,sys; checks=runpy.run_path('check-runtime.py'); print(checks['check']([sys.executable,'run.py']))"
      - name: 服务器源码包
        run: |
          python scripts/export-public.py --output dist/vrcx-cloud-v1.0.0-server.tar.gz
          cd dist
          sha256sum vrcx-cloud-v1.0.0-server.tar.gz > vrcx-cloud-v1.0.0-server.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server
          path: dist/vrcx-cloud-v1.0.0-server.tar.gz*
          if-no-files-found: error
