name: vrcx-cloud
services:
  app:
    build:
      context: ..
      dockerfile: server/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "${VRCX_BIND_HOST:-127.0.0.1}:${VRCX_PORT:-8080}:8080"
    volumes:
      - vrcx-cloud-data:/state
    tmpfs:
      - /tmp
volumes:
  vrcx-cloud-data:
